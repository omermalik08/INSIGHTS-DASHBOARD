<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Table Metric Gold Preview</title>
  <style>
    html,body{margin:0;min-height:100%;background:#050606;color:#e8ecee;font-family:Inter,Arial,sans-serif}
    .loading{min-height:100vh;display:grid;place-items:center;text-align:center}
    .loading b{color:#e6ca56;letter-spacing:.16em;text-transform:uppercase}
    .loading span{display:block;margin-top:8px;color:#a9b2b5;font-size:12px}
  </style>
</head>
<body>
  <div class="loading"><div><b>Loading Preview</b><span>Metric title rows and table scope update</span></div></div>
  <script>
    const replacements = [
      [
        ".metricRow td{background:linear-gradient(140deg,rgba(255,255,255,.055),rgba(0,0,0,.66));color:#dce2e4;font-weight:900}.metricName{cursor:pointer;color:#f2d86e;font-weight:950}.metricName small{display:block;color:#c7ced1;font-size:10px}",
        ".metricRow td{background:linear-gradient(120deg,rgba(226,181,57,.62),rgba(162,108,18,.48) 52%,rgba(244,211,103,.58)),rgba(58,39,7,.28);color:#050505!important;font-weight:950;border-top:1px solid rgba(255,226,125,.3);border-bottom:1px solid rgba(80,52,6,.24);box-shadow:inset 0 1px 0 rgba(255,246,184,.24),0 8px 22px rgba(0,0,0,.18);backdrop-filter:blur(14px)}.metricName{cursor:pointer;color:#050505!important;font-weight:950;font-size:15px;letter-spacing:.04em}.metricName small{display:block;color:#171107!important;font-size:11px;font-weight:900;margin-top:4px}"
      ],
      ["body.light .blackGlass td,body.light .metricRow td,body.light .dept td", "body.light .blackGlass td,body.light .dept td"],
      ["<th>Metric</th><th>Scope</th><th>Live Portfolio</th><th>3 Month Avg</th><th>Best</th>", "<th>Metric</th><th>Live Portfolio</th><th>3 Month Avg</th><th>Best</th>"],
      ["<th>Metric</th><th>Scope</th><th>Live</th><th>3 Month Avg</th><th>Best</th>", "<th>Metric</th><th>Live</th><th>3 Month Avg</th><th>Best</th>"],
      ["<tr><td colspan='5'>Select at least one metric, facility, and pay period.</td></tr>", "<tr><td colspan='4'>Select at least one metric, facility, and pay period.</td></tr>"],
      ["<td data-label='Scope'>${m.s}</td>", ""],
      ["<tr class='note'><td colspan='5'>Expanded rows are grouped by facility. Department lines do not repeat the facility name.</td></tr>", "<tr class='note'><td colspan='4'>Expanded rows are grouped by facility. Department lines do not repeat the facility name.</td></tr>"],
      ["<td data-label='Scope'>Total</td>", ""],
      ["<td data-label='Scope'>Department</td>", ""]
    ];

    fetch("pressure-dome-tall-gauge-approval-preview.html?v=scopedtiles1", { cache: "no-store" })
      .then(response => response.text())
      .then(html => {
        for (const [from, to] of replacements) html = html.split(from).join(to);
        document.open();
        document.write(html);
        document.close();
      })
      .catch(() => {
        document.body.innerHTML = "<div class='loading'><div><b>Preview Error</b><span>Please refresh the page.</span></div></div>";
      });
  </script>
</body>
</html>
