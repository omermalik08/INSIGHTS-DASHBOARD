<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pressure Dome Tall Gauge Approval Preview</title>
<style>
body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:#050606;
  color:#edf3f4;
  font-family:Inter,Arial,sans-serif;
}
.loading{
  border:1px solid rgba(215,173,56,.34);
  border-radius:14px;
  background:rgba(0,0,0,.42);
  padding:18px 20px;
  text-align:center;
  box-shadow:0 24px 80px rgba(0,0,0,.55);
}
.loading b{
  display:block;
  color:#f2df8f;
  font-size:14px;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.loading span{
  display:block;
  margin-top:8px;
  color:#aeb8bb;
  font-size:12px;
}
</style>
</head>
<body>
<div class="loading"><b>Loading Preview</b><span>Gauge tiles with increased height</span></div>
<script>
(async()=>{
  const base = 'pressure-dome-executive-facility-table-preview.html?v=tallGaugeBase1';
  const tallerGaugeStyles = `
<style id="tall-gauge-approval-overrides">
.tiles{
  max-width:1360px!important;
  grid-template-rows:repeat(3,minmax(310px,auto))!important;
  gap:20px!important;
  margin-bottom:30px!important;
}
.tile{
  min-height:310px!important;
  padding:18px!important;
}
.tiles .green,
.tile.big{
  min-height:392px!important;
}
.ring{
  width:154px!important;
  height:154px!important;
}
.tiles .green .ring,
.tile.big .ring{
  width:192px!important;
  height:192px!important;
}
.val{
  margin:22px 0 12px!important;
}
.tile.big .val,
.tiles .green .val{
  margin-top:30px!important;
}
.mini{
  left:16px!important;
  right:16px!important;
  bottom:16px!important;
}
.pane{
  min-height:54px!important;
}
@media(max-width:1000px){
  .tiles{
    grid-template-rows:none!important;
    max-width:860px!important;
  }
  .tiles .tile{
    min-height:318px!important;
  }
  .tiles .green,
  .tile.big{
    min-height:390px!important;
  }
}
@media(max-width:650px){
  .tiles .tile{
    min-height:330px!important;
  }
  .tiles .green,
  .tile.big{
    min-height:380px!important;
  }
  .ring{
    width:148px!important;
    height:148px!important;
  }
  .tiles .green .ring,
  .tile.big .ring{
    width:178px!important;
    height:178px!important;
  }
}
</style>`;
  try{
    const response = await fetch(base,{cache:'no-store'});
    if(!response.ok) throw new Error('Preview base did not load');
    let html = await response.text();
    html = html.replace('<title>Pressure Dome Executive Facility Preview</title>','<title>Pressure Dome Tall Gauge Approval Preview</title>');
    html = html.replace('</head>',`${tallerGaugeStyles}</head>`);
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML = '<div class="loading"><b>Preview Error</b><span>Please refresh once. The approved dashboard was not changed.</span></div>';
  }
})();
</script>
</body>
</html>
